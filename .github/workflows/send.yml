name: Send from GitHub (optional)

# Only needed if you'd rather GitHub send the message by email or Twilio than
# have your phone text it. Does nothing unless the DELIVERY variable is set.

on:
  schedule:
    # GitHub cron runs on UTC, so 7:30am Mountain needs one line for daylight time
    # and one for standard time; send.py sends from whichever matches today.
    # Changed SEND_TIME or TIMEZONE? Run `python send.py --print-cron` and paste
    # the result over these two lines.
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only print today's message"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send:
    if: vars.DELIVERY != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCHEDULE: ${{ github.event.schedule }}
      # Settings > Secrets and variables > Actions > Variables
      RECIPIENT_NAME: ${{ vars.RECIPIENT_NAME }}
      TIMEZONE: ${{ vars.TIMEZONE }}
      SEND_TIME: ${{ vars.SEND_TIME }}
      BIRTHDAY: ${{ vars.BIRTHDAY }}
      SIGN_OFF: ${{ vars.SIGN_OFF }}
      DELIVERY: ${{ vars.DELIVERY }}
      EMAIL_SUBJECT: ${{ vars.EMAIL_SUBJECT }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      # Settings > Secrets and variables > Actions > Secrets
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMS_TO: ${{ secrets.SMS_TO }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send today's message
        run: python send.py ${{ inputs.dry_run && '--dry-run' || '' }}
